[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nextgen-anything"
version = "0.1.0"
description = "Cross-OS Software Inspection, Sandbox Simulation, Mock Runtime & Autonomous Reconstruction Engine"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [
    { name = "NextGen-Anything Team" }
]
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0"
]

[project.scripts]
nga = "nga.interfaces.cli:main"
nextgen-anything = "nga.interfaces.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["nga*"]
