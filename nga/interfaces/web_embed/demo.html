<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>NextGen-Anything (`nga`) — Website Embed Demo</title>
  <link rel="stylesheet" href="./nga-widget.css" />
  <style>
    body {
      margin: 0;
      padding: 28px 16px;
      background: #0b0f14;
      color: #e6edf3;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
    }
    .page-wrap {
      max-width: 760px;
      margin: 0 auto;
    }
    h1 {
      font-size: 1.3rem;
      margin: 0 0 8px 0;
    }
    p {
      color: #8b949e;
      margin: 0 0 18px 0;
      font-size: 0.92rem;
    }
  </style>
</head>
<body>
  <div class="page-wrap">
    <h1>Embed <code>NextGen-Anything (nga)</code> on Any Website</h1>
    <p>
      Start the local server with <code>nga ui --port 8765</code>, then test sandbox simulation or status
      directly from the embedded widget below.
    </p>
    <div id="nga-widget" data-nga-endpoint="http://127.0.0.1:8765"></div>
  </div>
  <script src="./nga-widget.js" defer></script>
</body>
</html>
