<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>NextGen-Anything (`nga`) — Web SDK Integration Example</title>
  <style>
    body {
      margin: 0;
      padding: 24px 16px;
      background: #0d1117;
      color: #e6edf3;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
    }
    .container {
      max-width: 780px;
      margin: 0 auto;
    }
    h1 {
      margin: 0 0 8px 0;
      font-size: 1.25rem;
    }
    p {
      color: #8b949e;
      margin: 0 0 16px 0;
      font-size: 0.9rem;
    }
    .toolbar {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 12px;
    }
    button {
      padding: 8px 14px;
      border-radius: 6px;
      border: 1px solid #30363d;
      background: #2f81f7;
      color: #ffffff;
      font-weight: 600;
      cursor: pointer;
    }
    button.secondary {
      background: #161b22;
      color: #e6edf3;
    }
    pre {
      margin: 0;
      padding: 12px;
      border-radius: 8px;
      border: 1px solid #30363d;
      background: #161b22;
      font-size: 0.8rem;
      overflow-x: auto;
      max-height: 320px;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Web SDK Example — <code>NgaJsClient</code></h1>
    <p>
      Connects to a running <code>nga ui --port 8765</code> server using ES modules.
    </p>
    <div class="toolbar">
      <button id="btn-doctor" type="button">Check Doctor</button>
      <button id="btn-sim" class="secondary" type="button">Run Sandbox Simulation</button>
      <button id="btn-brief" class="secondary" type="button">Generate Brief</button>
    </div>
    <pre id="sdk-output">Click a button above to call NgaJsClient...</pre>
  </div>

  <script type="module">
    import { NgaJsClient } from "../js/nga-client.mjs";

    const client = new NgaJsClient("http://127.0.0.1:8765");
    const out = document.getElementById("sdk-output");

    const render = (payload) => {
      out.textContent = JSON.stringify(payload, null, 2);
    };

    document.getElementById("btn-doctor").addEventListener("click", async () => {
      render(await client.doctor());
    });

    document.getElementById("btn-sim").addEventListener("click", async () => {
      render(
        await client.simulatePython(
          'items = [10, 20, 30]\nassert sum(items) == 60\nprint("SUM_OK:", sum(items))',
          "web_sdk_demo"
        )
      );
    });

    document.getElementById("btn-brief").addEventListener("click", async () => {
      render(await client.brief("sample_web_app", "web"));
    });
  </script>
</body>
</html>
